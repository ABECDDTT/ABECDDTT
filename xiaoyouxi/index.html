<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一字诀 · 一个字的奇幻漂流</title>
<style>
  :root{
    --bg:#0d0a08; --bg2:#1a1410; --card:#221a13; --line:#3a2e1d;
    --gold:#c8a050; --gold2:#e4c884; --ink:#e8ddc6; --ink2:#a89878;
    --dim:#6a5a42; --spirit:#9a7fd4; --good:#8fd694; --warn:#e8a04a;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{background:
    radial-gradient(circle at 50% -10%, #2a1f12 0%, transparent 60%),
    linear-gradient(180deg,#0d0a08,#08060a);
    color:var(--ink);font-family:"KaiTi","STKaiti","SimSun",serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    -webkit-font-smoothing:antialiased;overflow-x:hidden;}
  #app{width:100%;max-width:680px;padding:24px;position:relative;z-index:1;}
  #title-screen{text-align:center;animation:fadeUp .9s ease;}
  #title-screen h1{font-size:54px;letter-spacing:14px;margin-bottom:8px;
    background:linear-gradient(180deg,#e4c884,#8a6a2a);-webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 30px rgba(200,160,80,.3);}
  #title-screen .sub{color:var(--dim);letter-spacing:6px;font-size:15px;margin-bottom:30px;}
  #title-screen .desc{color:var(--ink2);font-size:15px;line-height:2.1;max-width:480px;margin:0 auto 36px;
    border:1px solid var(--line);border-radius:10px;padding:20px 24px;background:rgba(34,26,19,.5);}
  .big-btn{background:linear-gradient(180deg,#3a2e1d,#241b10);border:1px solid var(--gold);
    color:var(--gold2);font-family:inherit;font-size:19px;letter-spacing:6px;padding:14px 48px;
    border-radius:8px;cursor:pointer;transition:all .3s;box-shadow:0 4px 18px rgba(0,0,0,.5);}
  .big-btn:hover{background:linear-gradient(180deg,#5a4628,#3a2e1d);box-shadow:0 0 24px rgba(200,160,80,.4);transform:translateY(-2px);}
  #game-screen{display:none;animation:fadeUp .6s ease;}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;color:var(--dim);font-size:13px;letter-spacing:3px;}
  .topbar b{color:var(--gold2);font-weight:normal;}
  .scene-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:26px 28px;
    box-shadow:0 6px 28px rgba(0,0,0,.5);position:relative;overflow:hidden;}
  .scene-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);}
  .scene-title{color:var(--gold2);font-size:22px;letter-spacing:4px;margin-bottom:6px;}
  .scene-tag{color:var(--dim);font-size:12px;letter-spacing:2px;margin-bottom:18px;}
  .scene-desc{color:var(--ink);font-size:16.5px;line-height:2;text-align:justify;min-height:120px;}
  .scene-emoji{font-size:42px;text-align:center;margin:14px 0;opacity:.85;letter-spacing:8px;}
  .spirit{display:flex;gap:12px;align-items:flex-start;margin:18px 0 14px;min-height:62px;}
  .spirit-avatar{flex-shrink:0;width:42px;height:42px;border-radius:50%;
    background:radial-gradient(circle,#6a4f9e,#3a2e5a);border:2px solid var(--spirit);
    display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--gold2);
    box-shadow:0 0 14px rgba(154,127,212,.4);}
  .spirit-bubble{flex:1;background:rgba(106,79,158,.12);border:1px solid rgba(154,127,212,.35);
    border-radius:10px;padding:10px 14px;color:var(--ink2);font-size:14px;line-height:1.8;min-height:42px;
    display:flex;align-items:center;}
  .spirit-bubble.perfect{border-color:var(--gold);background:rgba(200,160,80,.12);color:var(--gold2);}
  .spirit-bubble.meme{border-color:var(--warn);background:rgba(232,160,74,.12);color:#f0c890;}
  .spirit-bubble.special{border-color:var(--spirit);background:rgba(154,127,212,.16);color:#c8a8e8;}
  .spirit-bubble.fail{border-color:var(--dim);color:var(--dim);font-style:italic;}
  .input-row{display:flex;gap:10px;margin-top:6px;}
  .word-input{flex:1;background:#0e0b07;border:1px solid var(--line);border-radius:8px;
    padding:14px 18px;color:var(--gold2);font-family:inherit;font-size:22px;letter-spacing:6px;
    text-align:center;outline:none;transition:all .3s;}
  .word-input::placeholder{color:var(--dim);font-size:14px;letter-spacing:3px;}
  .word-input:focus{border-color:var(--gold);box-shadow:0 0 18px rgba(200,160,80,.25);}
  .submit-btn{background:linear-gradient(180deg,#3a2e1d,#241b10);border:1px solid var(--gold);
    color:var(--gold2);font-family:inherit;font-size:15px;letter-spacing:3px;padding:0 24px;
    border-radius:8px;cursor:pointer;transition:all .3s;}
  .submit-btn:hover{background:#5a4628;box-shadow:0 0 14px rgba(200,160,80,.3);}
  .input-hint{text-align:center;color:var(--dim);font-size:12px;letter-spacing:2px;margin-top:10px;min-height:16px;}
  #end-screen{display:none;text-align:center;animation:fadeUp .9s ease;}
  #end-screen h2{font-size:34px;color:var(--gold2);letter-spacing:8px;margin-bottom:10px;
    text-shadow:0 0 24px rgba(200,160,80,.4);}
  .word-chain{font-size:28px;letter-spacing:10px;color:var(--gold);margin:20px 0 12px;
    padding:14px;border:1px dashed var(--line);border-radius:10px;background:rgba(34,26,19,.4);word-break:break-all;}
  .verdict{color:var(--ink2);font-size:16px;line-height:2.2;max-width:480px;margin:0 auto 24px;
    border:1px solid var(--line);border-radius:10px;padding:20px 24px;background:rgba(34,26,19,.5);text-align:left;}
  .verdict b{color:var(--gold2);}
  @keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}
  .result-pop{animation:pop .45s ease;}
  @keyframes pop{0%{transform:scale(.9);opacity:0;}60%{transform:scale(1.03);}100%{transform:scale(1);opacity:1;}}
  .float-words{position:fixed;pointer-events:none;color:rgba(200,160,80,.10);font-size:120px;z-index:0;user-select:none;}
  @media(max-width:520px){
    #title-screen h1{font-size:40px;letter-spacing:8px;}
    .scene-card{padding:20px 18px;}
    .word-chain{font-size:22px;letter-spacing:6px;}
  }
</style>
</head>
<body>
<div class="float-words" style="top:8%;left:4%;">字</div>
<div class="float-words" style="bottom:10%;right:6%;">诀</div>

<div id="app">
  <div id="title-screen">
    <h1>一 字 诀</h1>
    <div class="sub">一 个 字 的 奇 奇 幻 漂 流</div>
    <div class="desc">
      你是<b style="color:var(--gold2)">字灵</b>，能以一个字改写世间困境。<br>
      山道遇虎、断桥火海、迷雾深渊……<br>
      每一关，你只能输入<b style="color:var(--gold2)">一个汉字</b>破局。<br>
      没有选项，唯有你的想象。<br>
      <span style="color:var(--dim);font-size:13px;">（妙解有奇效，梗字有惊喜，哲字有玄机。通关后，你这一路的字，将组成你独有的结局）</span>
    </div>
    <button class="big-btn" id="start-btn">以 字 入 世</button>
  </div>

  <div id="game-screen">
    <div class="topbar">
      <span>第 <b id="lvl-num">1</b> 关 / 共 10 关</span>
      <span>已书：<b id="chain-display">—</b></span>
    </div>
    <div class="scene-card">
      <div class="scene-title" id="scene-title"></div>
      <div class="scene-tag" id="scene-tag"></div>
      <div class="scene-emoji" id="scene-emoji"></div>
      <div class="scene-desc" id="scene-desc"></div>
      <div class="spirit">
        <div class="spirit-avatar">灵</div>
        <div class="spirit-bubble" id="spirit-bubble">字灵候命。书一字，吾便应之。</div>
      </div>
      <div class="input-row">
        <input class="word-input" id="word-input" maxlength="1" placeholder="以一字破之…" autocomplete="off" />
        <button class="submit-btn" id="submit-btn">书</button>
      </div>
      <div class="input-hint" id="input-hint">回车提交 · 妙解有奇效，梗字有惊喜，哲字有玄机</div>
    </div>
  </div>

  <div id="end-screen">
    <h2>字 已 成 诀</h2>
    <div class="word-chain" id="word-chain"></div>
    <div class="verdict" id="verdict"></div>
    <button class="big-btn" id="replay-btn">重 新 书 字</button>
  </div>
</div>

<script>
(function(){

var inputHint=document.getElementById('input-hint');

function showGame(){
  titleScreen.style.display='none'; endScreen.style.display='none'; gameScreen.style.display='block';
  lvl=0; chain=[]; renderLevel();
}
function renderLevel(){
  var L=LEVELS[lvl];
  lvlNum.textContent=lvl+1;
  sceneTitle.textContent=L.title; sceneTag.textContent=L.tag;
  sceneEmoji.textContent=L.emoji; sceneDesc.textContent=L.desc;
  spiritBubble.className='spirit-bubble';
  spiritBubble.textContent='字灵候命。书一字，吾便应之。';
  wordInput.value=''; wordInput.placeholder='以一字破之…';
  inputHint.textContent='回车提交 · 妙解有奇效，梗字有惊喜，哲字有玄机';
  updateChain();
  setTimeout(function(){ try{wordInput.focus();}catch(e){} },120);
}
function updateChain(){ chainDisplay.textContent = chain.length ? chain.join(' · ') : '—'; }

function match(raw){
  var L=LEVELS[lvl];
  var w=raw;
  if(L.perfect[w]) return {type:'perfect', text:L.perfect[w]};
  if(L.meme[w]) return {type:'meme', text:L.meme[w]};
  if(GLOBAL_MEME[w]) return {type:'meme', text:GLOBAL_MEME[w].replace('{t}',L.title)};
  if(SPECIAL[w]) return SPECIAL[w];
  for(var i=0;i<CLUSTERS.length;i++){
    if(CLUSTERS[i].chars.indexOf(w)>=0){
      return {type:'good', text:CLUSTERS[i].res.replace('{w}',w)};
    }
  }
  var g=GENERIC_PASS[Math.floor(Math.random()*GENERIC_PASS.length)];
  return {type:'good', text:g.replace('{w}',w)};
}

function submit(){
  var raw=(wordInput.value||'').trim();
  if(!raw){ inputHint.textContent='请书一字。'; return; }
  /* 一字诀：只收单字 */
  if(Array.from(raw).length>1){
    spiritBubble.className='spirit-bubble fail';
    spiritBubble.textContent='字灵摇头：「一字诀——只书一字。」';
    wordInput.value=''; return;
  }
  /* 元叙事彩蛋 */
  if(raw==='字'||raw==='灵'){
    spiritBubble.className='spirit-bubble special';
    spiritBubble.textContent='字灵一笑：「你唤我作甚？此字不通——但你既知此乃诀，便已通了一半。换一字试试。」';
    wordInput.value=''; return;
  }
  if(raw==='问'||raw==='疑'||raw==='？'){
    spiritBubble.className='spirit-bubble';
    spiritBubble.textContent='字灵低语：「此境无定解，随心而书即是。试与困境相干之字，或大胆一些——哲字、梗字，皆可通。」';
    wordInput.value=''; return;
  }
  if(chain.indexOf(raw)>=0){
    spiritBubble.className='spirit-bubble fail';
    spiritBubble.textContent='字灵侧目：「'+raw+'？你方才不是已书过么？换一字试试，字字不同，境境不同。」';
    wordInput.value=''; return;
  }
  var r=match(raw);
  if(r.type==='fail'){
    spiritBubble.className='spirit-bubble fail';
    spiritBubble.textContent=r.text;
    wordInput.value=''; return;
  }
  spiritBubble.className='spirit-bubble '+r.type;
  spiritBubble.textContent=r.text;
  spiritBubble.classList.add('result-pop');
  setTimeout(function(){spiritBubble.classList.remove('result-pop');},460);
  chain.push(raw);
  updateChain();
  wordInput.value='';
  inputHint.textContent = r.type==='perfect' ? '✦ 妙解！字灵喝彩。' :
                           r.type==='meme' ? '※ 梗字！字灵憋笑。' :
                           r.type==='special' ? '※ 哲字！字灵颔首。' : '· 通解。前路已开。';
  setTimeout(function(){
    if(lvl < LEVELS.length-1){ lvl++; renderLevel(); }
    else { showEnd(); }
  }, 1900);
}

function showEnd(){
  gameScreen.style.display='none';
  endScreen.style.display='block';
  document.getElementById('word-chain').textContent = chain.join('  ');
  document.getElementById('verdict').innerHTML = verdict();
}

function verdict(){
  var perfect=0, meme=0, special=0, cluster={};
  chain.forEach(function(w,i){
    var L=LEVELS[i];
    if(L.perfect[w]){perfect++;return;}
    if(L.meme[w]){meme++;return;}
    if(GLOBAL_MEME[w]){meme++;return;}
    if(SPECIAL[w]&&SPECIAL[w].type!=='fail'){special++;return;}
    for(var k=0;k<CLUSTERS.length;k++){ if(CLUSTERS[k].chars.indexOf(w)>=0){ cluster[CLUSTERS[k].name]=(cluster[CLUSTERS[k].name]||0)+1; return; } }
  });
  var lines=[];
  if(perfect===10) lines.push('<b>「字灵本灵」</b>——十关皆妙解，你不是字灵的传人，<b>你就是字灵本身</b>。');
  else if(perfect>=7) lines.push('<b>「字灵转世」</b>——'+perfect+'次妙解，你是带着字灵记忆来到此世的人。');
  else if(perfect>=4) lines.push('<b>「字灵钟爱」</b>——'+perfect+'次妙解，天地偏爱的奇才。');
  else if(perfect>=2) lines.push('你偶得'+perfect+'次妙解，是心中有灵光之人。');
  else if(perfect===0) lines.push('你这一路无妙解，却字字踏实——是<b>凡人中的凡人</b>，亦是最真。');
  var mg=meme;
  if(mg===10) lines.push('<b>「梗王」</b>——十关皆梗，你是这世间最不正经的仙人，玩世不恭至极。');
  else if(mg>=6) lines.push('<b>「玩世不恭」</b>——'+mg+'次梗字，看透一切的顽仙。');
  else if(mg>=3) lines.push('<b>「嬉笑人间」</b>——'+mg+'次梗字，藏不住的顽心。');
  else if(mg>=1) lines.push('你'+mg+'次书了梗字，藏不住几分顽心。');
  if(special>=4) lines.push('<b>「悟道者」</b>——'+special+'次哲字，你以玄机破境，是心向大道之人。');
  else if(special>=2) lines.push('你'+special+'次书了哲字，心中有几分玄思。');
  var dom=null,domN=0;
  for(var c in cluster){ if(cluster[c]>domN){domN=cluster[c];dom=c;} }
  if(dom && domN>=3){
    var map={water:'上善若水',fire:'烈火烹油',hand:'一双手闯天下',wood:'草木皆可为友',earth:'脚踏实地',heart:'以心观世',mouth:'一言成谶',walk:'步步生莲',metal:'锋芒毕露',light:'心向光明',person:'众缘相助'};
    lines.push('你这一路多与「<b>'+(map[dom]||dom)+'</b>」相系，是其道的修行者。');
  }
  if(chain.length>=2 && chain[0]===chain[chain.length-1])
    lines.push('<b>「首尾回环」</b>——你以「'+chain[0]+'」始，以「'+chain[0]+'」终，是首尾相扣的圆满。');
  if(chain.indexOf('道')>=0) lines.push('你书过「道」字，是<b>问道</b>之人。');
  if(chain.indexOf('心')>=0) lines.push('你书过「心」字，是<b>修心</b>之人。');
  if(chain.indexOf('我')>=0) lines.push('你书过「我」字，是<b>认得自己</b>的人。');
  if(chain.indexOf('无')>=0) lines.push('你书过「无」字，是<b>看破</b>之人。');
  lines.push('<br>你的字诀为：<b style="color:var(--gold)">'+chain.join('')+'</b>。');
  lines.push('此诀只属于你这一程。再来一次，未必相同——字随心走，心随境转。');
  return lines.join('<br>');
}

startBtn.addEventListener('click', showGame);
replayBtn.addEventListener('click', showGame);
submitBtn.addEventListener('click', submit);
wordInput.addEventListener('keydown', function(e){
  if(e.key==='Enter'){ e.preventDefault(); submit(); }
});
})();
</script>
