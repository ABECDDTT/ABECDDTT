<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>推推乐 · 一玩就停不下来</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    /* 木纹竖条板背景 */
    background:
      repeating-linear-gradient(90deg,
        #c9a86c 0px, #deb578 5px, #c9a86c 10px, #b8945a 16px),
      linear-gradient(180deg, #8b6914, #5c3a0e);
    font-family: "Courier New", "PingFang SC", monospace;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none;
    touch-action: none;
    overscroll-behavior: none;
    position: fixed; inset: 0;
  }
  #wrap {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    /* 适配刘海屏安全区 */
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: transparent;
    box-shadow: 0 0 0 3px #5C3A1E, 0 0 0 6px #2a1a0c, 0 20px 50px rgba(0,0,0,.6);
    border-radius: 4px;
    touch-action: none;
    cursor: pointer;
    display: block;
  }
</style>
</head>
<body>
  <div id="wrap"><canvas id="cv"></canvas></div>
<script>
"use strict";
(function () {
  // ===================== 网格（列数固定 100，行数随屏幕自适应以铺满整屏）=====================
  const COLS = 100, MAXROWS = 400; // 100 列；行数动态，最多 400 行
  let ROWS = 140; // 行数随屏幕高宽比变化，使棋盘铺满整屏

  // ===================== 响应式布局变量（随屏幕计算）=====================
  let DPR = 1, VW = 0, VH = 0;
  let CELL = 3, boardX = 0, boardY = 0, boardW = 0, boardH = 0, FRAME = 8, hudH = 96;
  let hardBtn = null, menuBtn = null, nextBox = null, progBar = null, restartBtn = null, coverBtn2 = null;
  let titlePos = null, scorePos = null, countSwatches = [];

  const cv = document.getElementById("cv");
  const ctx = cv.getContext("2d");

  // 4 色（鲜艳像素风：红/黄/蓝/粉）
  const COLORS = [
    null,
    { base: "#E94B4B", light: "#FF7B7B", dark: "#B32E2E" }, // 红
    { base: "#FFD93D", light: "#FFE580", dark: "#C9A000" }, // 黄
    { base: "#4B7BE9", light: "#80A8FF", dark: "#2B4FA8" }, // 蓝
    { base: "#E94BD1", light: "#FF80EE", dark: "#B32EA0" }, // 粉
  ];
  const FLAME = ["#fff27a", "#ffd23f", "#ff9e3d", "#ff5a3d"];

  // ===================== 布局（棋盘铺满整屏：列固定 100，行数随屏幕自适应）=====================
  function layout() {
    VW = Math.max(280, window.innerWidth);
    VH = Math.max(420, window.innerHeight);
    DPR = Math.min(3, window.devicePixelRatio || 1);
    cv.width = Math.max(1, Math.round(VW * DPR));
    cv.height = Math.max(1, Math.round(VH * DPR));
    cv.style.width = VW + "px";
    cv.style.height = VH + "px";

    // 关键：单格 = 屏宽/100，行数 = 屏高/单格 → 棋盘宽=屏宽、高=屏高，铺满整屏，无空白
    let cell = Math.max(2, Math.floor(VW / COLS));
    CELL = cell;
    let rows = Math.floor(VH / CELL);
    rows = Math.max(40, Math.min(MAXROWS, rows));
    if (rows !== ROWS) {
      if (rows > ROWS) grid.fill(0, ROWS * COLS, rows * COLS); // 清掉新露出的行，防旧沙重现
      ROWS = rows;
      if (piece) piece.col0 = Math.max(0, Math.min(COLS - shapeWidth(piece.cells), piece.col0));
    }
    boardX = 0; boardY = 0;
    boardW = COLS * CELL; boardH = ROWS * CELL;
    FRAME = Math.max(3, Math.round(CELL * 0.4));

    // HUD 全部悬浮在棋盘之上，不占额外空间
    titlePos = { x: 8, y: 18 };
    scorePos = { x: VW / 2, y: 18 };
    menuBtn = { x: VW - 54, y: 6, w: 48, h: 20 };
    // 颜色累计：悬浮在棋盘左下角
    countSwatches = [];
    const cw = 12, cgap = 6, cY = VH - 22;
    for (let i = 0; i < 4; i++) countSwatches.push({ x: 8 + i * (cw + cgap), y: cY, w: cw, h: cw });
    progBar = { x: 0, y: 0, w: VW, h: 3 };
    hardBtn = { x: Math.round(VW / 2 - 100), y: VH - 32, w: 200, h: 26 };
    restartBtn = { x: VW / 2 - 80, y: Math.round(VH * 0.62), w: 160, h: 48 };
    coverBtn2 = { x: VW / 2 - 80, y: Math.round(VH * 0.62) + 58, w: 160, h: 42 };
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  // ===================== 音效（WebAudio 合成）=====================
  let actx = null, muted = false;
  function ensureAudio() { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } }
  function beep(freq, dur, type, vol) {
    if (muted || !actx) return;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || "square"; o.frequency.value = freq;
    g.gain.value = vol || 0.1;
    o.connect(g); g.connect(actx.destination);
    const t = actx.currentTime;
    g.gain.setValueAtTime(g.gain.value, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.start(t); o.stop(t + dur);
  }
  const sndDrop = () => beep(220, 0.08, "square", 0.08);
  const sndClear = () => { beep(880, 0.12, "square", 0.12); beep(1320, 0.14, "square", 0.08); };
  const sndOver = () => { beep(220, 0.5, "sawtooth", 0.18); beep(140, 0.6, "sawtooth", 0.14); };

  // ===================== BGM START（欢快循环背景音乐 · 可整体删除）=====================
  // ★ 删除方法：删掉「BGM START」到「BGM END」整段，再删掉其余 4 处 `if (typeof startBGM === "function")` 等守卫调用即可。
  // ★ 所有外部调用都已用 typeof 守卫包裹，删除本段后不会抛错、不影响主玩法与既有音效(SFX)。
  // ★ 音乐：C 大调 I–V–vi–IV 进行，每和弦 1 小节八分音符琶音 + 低音 + 轻快打击点，124 BPM。
  let bgmTimer = null, bgmNext = 0, bgmStep = 0, bgmPlaying = false, bgmGain = null;
  const BGM_BPM = 124;
  const BGM_STEP = (60 / BGM_BPM) / 2;          // 八分音符时长（秒）
  const BGM_A = 440;                            // A4 基准
  const semiFreq = s => BGM_A * Math.pow(2, s / 12);
  const BGM_CHORDS = [-9, -2, 0, -4];           // C4, G4, A4, F4（相对 A4 的半音）
  const BGM_ARP = [0, 4, 7, 12, 7, 4, 7, 4];    // 琶音偏移
  function bgmTone(freq, t, dur, type, vol) {
    if (!actx || !bgmGain) return;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(bgmGain);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function bgmNoise(t, dur, vol) {
    if (!actx || !bgmGain) return;
    const len = Math.max(1, Math.floor(actx.sampleRate * dur));
    const buf = actx.createBuffer(1, len, actx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = actx.createBufferSource(); src.buffer = buf;
    const g = actx.createGain(); g.gain.value = vol;
    src.connect(g); g.connect(bgmGain); src.start(t);
  }
  function bgmScheduler() {
    if (!actx || !bgmGain) return;
    while (bgmNext < actx.currentTime + 0.15) {
      const ci = Math.floor(bgmStep / 8) % BGM_CHORDS.length;
      const si = bgmStep % 8;
      const root = BGM_CHORDS[ci];
      bgmTone(semiFreq(root + BGM_ARP[si]), bgmNext, BGM_STEP * 0.9, "triangle", 0.10); // 旋律
      if (si === 0 || si === 4) bgmTone(semiFreq(root - 24), bgmNext, BGM_STEP * 1.9, "sine", 0.16); // 低音
      if (si % 2 === 1) bgmNoise(bgmNext, 0.03, 0.022); // 轻快打击点
      bgmStep++; bgmNext += BGM_STEP;
    }
  }
  function startBGM() {
    ensureAudio();
    if (!actx || bgmPlaying) return;
    if (!bgmGain) { bgmGain = actx.createGain(); bgmGain.connect(actx.destination); }
    bgmApply(); // 应用「开关 + 音量 + 全局静音」
    bgmPlaying = true; bgmStep = 0; bgmNext = actx.currentTime + 0.06;
    bgmScheduler();
    bgmTimer = setInterval(bgmScheduler, 25);
  }
  function stopBGM() {
    bgmPlaying = false;
    if (bgmTimer) { clearInterval(bgmTimer); bgmTimer = null; }
  }
  // ===================== BGM END =====================

  // ===================== 设置 / 存档 / 封面与菜单（独立模块）=====================
  // —— 设置：BGM 开关 + 音量（独立于上方可删除的 BGM 合成模块）——
  let bgmOn = true, bgmVol = 0.6;
  try {
    const s = JSON.parse(localStorage.getItem("ttl_settings") || "{}");
    if (typeof s.bgmOn === "boolean") bgmOn = s.bgmOn;
    if (typeof s.bgmVol === "number") bgmVol = Math.max(0, Math.min(1, s.bgmVol));
  } catch (e) {}
  function saveSettings() { try { localStorage.setItem("ttl_settings", JSON.stringify({ bgmOn, bgmVol })); } catch (e) {} }
  function bgmApply() { // 把「开关 + 音量 + 全局静音」应用到 BGM 增益（无 BGM 模块时安全跳过）
    if (typeof bgmGain !== "undefined" && bgmGain) bgmGain.gain.value = (bgmOn && !muted) ? bgmVol : 0;
  }

  // —— 浮层状态 ——
  let overlay = null;        // null | "pausemenu" | "settings" | "help"
  let overlayFrom = "cover"; // 设置/说明从哪进入：cover 或 pausemenu
  let toastMsg = null, toastT = 0;
  function toast(m) { toastMsg = m; toastT = 1.6; }
  function startBGMif() { if (bgmOn && typeof startBGM === "function") startBGM(); }

  // —— 存档 / 读档 ——
  function hasSave() { try { return !!localStorage.getItem("ttl_save"); } catch (e) { return false; } }
  function saveGame() {
    const g = [];
    for (let i = 0; i < ROWS * COLS; i++) g.push(grid[i]);
    const data = {
      v: 1, rows: ROWS, score: score, level: level, colorCounts: colorCounts,
      grid: g,
      piece: piece ? { cells: piece.cells, color: piece.color, col0: piece.col0 } : null,
      queue: queue.map(p => ({ cells: p.cells, color: p.color, col0: p.col0 })),
    };
    try { localStorage.setItem("ttl_save", JSON.stringify(data)); } catch (e) {}
  }
  function loadGame() {
    try {
      const raw = localStorage.getItem("ttl_save"); if (!raw) return false;
      const d = JSON.parse(raw); if (!d || !d.grid) return false;
      grid.fill(0);
      ROWS = Math.min(MAXROWS, d.rows || ROWS);
      const n = Math.min(d.grid.length, ROWS * COLS);
      for (let i = 0; i < n; i++) grid[i] = d.grid[i];
      score = d.score || 0; level = d.level || 1; colorCounts = d.colorCounts || [0, 0, 0, 0, 0];
      piece = d.piece ? { cells: d.piece.cells.map(p => ({ dr: p.dr, dc: p.dc })), color: d.piece.color, col0: d.piece.col0 } : null;
      queue = (d.queue || []).map(p => ({ cells: p.cells.map(c => ({ dr: c.dr, dc: c.dc })), color: p.color, col0: p.col0 }));
      state = "aim"; overlay = null; return true;
    } catch (e) { return false; }
  }

  // —— UI 按钮系统（绘制与点击共用同一坐标）——
  function inRect(x, y, r) { return x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h; }
  function drawButton(b) {
    const dis = b.disabled;
    ctx.fillStyle = dis ? "rgba(70,54,38,.7)" : (b.primary ? "rgba(120,72,30,.95)" : "rgba(92,58,30,.9)");
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeStyle = dis ? "#6b5638" : "#caa46a"; ctx.lineWidth = 1;
    ctx.strokeRect(b.x + 0.5, b.y + 0.5, b.w - 1, b.h - 1);
    ctx.fillStyle = dis ? "#9a8a72" : "#FFD93D";
    ctx.font = "bold " + (b.fs || 16) + "px Courier New"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2 + 1);
    ctx.textBaseline = "alphabetic";
  }
  function coverButtons() {
    const w = Math.min(240, VW - 60), h = 46, x = (VW - w) / 2;
    let y = VH * 0.36; const gap = 12;
    const bs = [];
    bs.push({ id: "start", x, y, w, h, label: "开始游戏", fs: 18, primary: true }); y += h + gap;
    bs.push({ id: "continue", x, y, w, h, label: "继续游戏", fs: 16, disabled: !hasSave() }); y += h + gap;
    bs.push({ id: "settings", x, y, w, h, label: "设置", fs: 16 }); y += h + gap;
    bs.push({ id: "help", x, y, w, h, label: "玩法说明", fs: 16 });
    return bs;
  }
  function pauseButtons() {
    const pw = Math.min(320, VW - 40), px = (VW - pw) / 2;
    const w = pw - 60, h = 42, x = px + 30;
    let y = VH / 2 - 130; const gap = 10;
    const bs = [];
    bs.push({ id: "resume", x, y, w, h, label: "继续游戏", fs: 16, primary: true }); y += h + gap;
    bs.push({ id: "save", x, y, w, h, label: "存档", fs: 15 }); y += h + gap;
    bs.push({ id: "toCover", x, y, w, h, label: "回到封面（自动存档）", fs: 15 }); y += h + gap;
    bs.push({ id: "settings", x, y, w, h, label: "设置", fs: 15 }); y += h + gap;
    bs.push({ id: "help", x, y, w, h, label: "玩法说明", fs: 15 });
    return bs;
  }
  function settingsButtons() {
    const pw = Math.min(340, VW - 40), px = (VW - pw) / 2;
    const w = pw - 50, x = px + 25;
    let y = VH / 2 - 70; const gap = 14, h = 42;
    const bs = [];
    bs.push({ id: "bgmToggle", x, y, w, h, label: "背景音乐：" + (bgmOn ? "开" : "关"), fs: 15 }); y += h + gap;
    const vw = (w - 20) / 3;
    bs.push({ id: "volDown", x, y, w: vw, h, label: "－", fs: 22 });
    bs.push({ id: "volVal", x: x + vw + 10, y, w: vw, h, label: Math.round(bgmVol * 100) + "%", fs: 15, disabled: true });
    bs.push({ id: "volUp", x: x + vw * 2 + 20, y, w: vw, h, label: "＋", fs: 22 });
    y += h + gap;
    bs.push({ id: "back", x, y, w, h, label: "返回", fs: 16, primary: true });
    return bs;
  }
  function helpButtons() {
    const pw = Math.min(360, VW - 40), px = (VW - pw) / 2;
    const w = pw - 50, h = 42, x = px + 25, y = VH / 2 + Math.min(150, VH * 0.30);
    return [{ id: "back", x, y, w, h, label: "返回", fs: 16, primary: true }];
  }
  function drawDim(a) { ctx.fillStyle = "rgba(15,8,3," + a + ")"; ctx.fillRect(0, 0, VW, VH); }
  function drawPanel(title) {
    const pw = Math.min(360, VW - 36), ph = Math.min(440, VH - 50);
    const px = (VW - pw) / 2, py = (VH - ph) / 2;
    ctx.fillStyle = "rgba(34,20,9,.96)"; roundRect(px, py, pw, ph, 12); ctx.fill();
    ctx.strokeStyle = "#caa46a"; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = "#FFD93D"; ctx.font = "bold 22px Courier New"; ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
    ctx.fillText(title, VW / 2, py + 34);
    return { px, py, pw, ph };
  }
  function coverDown(x, y) {
    for (const b of coverButtons()) {
      if (!inRect(x, y, b) || b.disabled) continue;
      if (b.id === "start") { resetGame(); startBGMif(); }
      else if (b.id === "continue") { if (loadGame()) startBGMif(); }
      else if (b.id === "settings") { overlay = "settings"; overlayFrom = "cover"; }
      else if (b.id === "help") { overlay = "help"; overlayFrom = "cover"; }
      return;
    }
  }
  function overlayDown(x, y) {
    if (overlay === "pausemenu") {
      for (const b of pauseButtons()) {
        if (!inRect(x, y, b)) continue;
        if (b.id === "resume") overlay = null;
        else if (b.id === "save") { saveGame(); toast("已存档 ✓"); }
        else if (b.id === "toCover") { saveGame(); if (typeof stopBGM === "function") stopBGM(); state = "cover"; overlay = null; }
        else if (b.id === "settings") { overlay = "settings"; overlayFrom = "pausemenu"; }
        else if (b.id === "help") { overlay = "help"; overlayFrom = "pausemenu"; }
        return;
      }
      return;
    }
    if (overlay === "settings") {
      for (const b of settingsButtons()) {
        if (!inRect(x, y, b) || b.disabled) continue;
        if (b.id === "bgmToggle") { bgmOn = !bgmOn; saveSettings(); bgmApply(); if (bgmOn) startBGMif(); }
        else if (b.id === "volDown") { bgmVol = Math.max(0, Math.round((bgmVol - 0.1) * 10) / 10); saveSettings(); bgmApply(); }
        else if (b.id === "volUp") { bgmVol = Math.min(1, Math.round((bgmVol + 0.1) * 10) / 10); saveSettings(); bgmApply(); }
        else if (b.id === "back") { overlay = overlayFrom === "cover" ? null : "pausemenu"; }
        return;
      }
      return;
    }
    if (overlay === "help") {
      for (const b of helpButtons()) { if (inRect(x, y, b)) { overlay = overlayFrom === "cover" ? null : "pausemenu"; } }
    }
  }

  // ===================== 游戏状态 =====================
  let grid = new Int8Array(COLS * MAXROWS); // 0空 1-4颜色（按最大行分配，实际只用前 ROWS 行）
  let state = "cover";  // cover | aim | falling | over
  let score = 0, best = 0, level = 1;
  let colorCounts = [0, 0, 0, 0, 0];
  let queue = [];
  let piece = null;
  let dragging = false;
  let shake = 0;
  let ticks = 0, maxTicks = 0;
  let floats = [];
  let particles = [];
  for (let i = 0; i < 600; i++) particles.push({ a: false, x: 0, y: 0, vx: 0, vy: 0, life: 0, max: 0, c: "#fff", s: 2 });
  try { best = parseInt(localStorage.getItem("ttl_best") || "0", 10) || 0; } catch (e) {}

  const idx = (r, c) => r * COLS + c;
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[(Math.random() * arr.length) | 0];

  // ===================== 方块形状库（每个 70~100 格，含斜向）=====================
  function rectShape(w, h) {
    const a = [];
    for (let r = 0; r < h; r++) for (let c = 0; c < w; c++) a.push({ dr: r, dc: c });
    return a;
  }
  function diamondShape(r) {
    const a = [];
    for (let dr = -r; dr <= r; dr++) for (let dc = -r; dc <= r; dc++)
      if (Math.abs(dr) + Math.abs(dc) <= r) a.push({ dr: dr + r, dc: dc + r });
    return a;
  }
  function diagBar(L, b) {
    const a = [];
    for (let i = 0; i < L; i++) for (let o = 0; o < b; o++) a.push({ dr: i, dc: i + o });
    return a;
  }
  function triShape(n) {
    const a = [];
    for (let r = 0; r < n; r++) for (let c = 0; c <= r; c++) a.push({ dr: r, dc: c });
    return a;
  }
  function diagTri(n) {
    const a = [];
    for (let r = 0; r < n; r++) for (let c = 0; c < n - r; c++) a.push({ dr: r, dc: c });
    return a;
  }
  function staircase(L, step) {
    const a = [];
    for (let r = 0; r < L; r++) for (let c = 0; c < step; c++) a.push({ dr: r, dc: r + c });
    return a;
  }
  const SHAPES = [
    () => rectShape(8, 9),   // 72
    () => rectShape(9, 9),   // 81
    () => rectShape(10, 9),  // 90
    () => rectShape(10, 10), // 100
    () => rectShape(7, 10),  // 70
    () => diamondShape(6),   // 85
    () => diagBar(14, 5),    // 70
    () => diagBar(16, 5),    // 80
    () => diagBar(18, 5),    // 90
    () => triShape(12),      // 78
    () => triShape(13),      // 91
    () => diagTri(13),      // 91
    () => staircase(14, 5),  // 70
  ];
  function shapeWidth(cells) { let m = 0; for (const p of cells) m = Math.max(m, p.dc); return m + 1; }
  function makePiece() {
    const cells = SHAPES[(Math.random() * SHAPES.length) | 0]().map(p => ({ dr: p.dr, dc: p.dc }));
    const color = 1 + ((Math.random() * 4) | 0);
    return { cells, color, col0: ((COLS - shapeWidth(cells)) / 2) | 0 };
  }

  function resetGame() {
    grid.fill(0);
    score = 0; level = 1; colorCounts = [0, 0, 0, 0, 0];
    queue = [makePiece(), makePiece(), makePiece()];
    spawnPiece();
    state = "aim";
  }
  function spawnPiece() {
    piece = queue.shift();
    queue.push(makePiece());
    piece.col0 = ((COLS - shapeWidth(piece.cells)) / 2) | 0;
    dragging = false;
  }

  // ===================== 沙子物理（带摩擦 / 堆积阻力）=====================
  // 规则：
  //  1) 正下方空 -> 直接下落（重力）。
  //  2) 仅当「侧面也空 且 斜下方也空」时才斜向滑落 —— 即只有堆体"边缘"、
  //     失去侧向支撑的颗粒才会塌落；平顶上的颗粒有侧向支撑，留在原地（摩擦）。
  //  3) 不横向倾倒 —— 去掉了之前的"细微散落"，颗粒靠阻力自然聚集、不强行摊平。
  const colOrder = new Int32Array(COLS);
  function sandTick() {
    let moved = false;
    for (let i = 0; i < COLS; i++) colOrder[i] = i;
    for (let i = COLS - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; const t = colOrder[i]; colOrder[i] = colOrder[j]; colOrder[j] = t; }
    for (let r = ROWS - 2; r >= 0; r--) {
      for (let k = 0; k < COLS; k++) {
        const c = colOrder[k];
        const i = idx(r, c);
        const v = grid[i];
        if (v === 0) continue;
        // 优先级1：正下方空 -> 直接下落
        if (grid[idx(r + 1, c)] === 0) { grid[idx(r + 1, c)] = v; grid[i] = 0; moved = true; continue; }
        // 优先级2：仅在边缘（侧面空 + 斜下空）才以中等概率滑落 —— 自然堆积
        const canL = c > 0 && grid[idx(r, c - 1)] === 0 && grid[idx(r + 1, c - 1)] === 0;
        const canR = c < COLS - 1 && grid[idx(r, c + 1)] === 0 && grid[idx(r + 1, c + 1)] === 0;
        if ((canL || canR) && Math.random() < 0.5) {
          const d = (canL && canR) ? (Math.random() < 0.5 ? -1 : 1) : (canL ? -1 : 1);
          grid[idx(r + 1, c + d)] = v; grid[i] = 0; moved = true; continue;
        }
        // 平顶 / 有侧向支撑 -> 留在原地（摩擦阻力，不散落）
      }
    }
    return moved;
  }

  // ===================== 消除（整行同色）=====================
  function spawnParticles(r, c) {
    const px = boardX + c * CELL + CELL / 2, py = boardY + r * CELL + CELL / 2;
    for (let n = 0; n < 2; n++) {
      let p = null;
      for (let q = 0; q < particles.length; q++) { if (!particles[q].a) { p = particles[q]; break; } }
      if (!p) return;
      p.a = true; p.x = px; p.y = py;
      p.vx = rand(-60, 60); p.vy = rand(-200, -90);
      p.life = 0.8; p.max = 0.8; p.c = pick(FLAME); p.s = rand(2, 4);
    }
  }
  // 紧邻消除区、且自身为小簇(≤此值)的散粒，一并清除，防止变死垃圾；大片/中等距离不清除
  const MERCY_MAX = 4;
  // 消除规则：同色「从左墙连到右墙」的连通块（不管在上在下、含斜向）一键消除。
  // 另：与消除区紧邻(距离1)、不同色、且自身是小簇的散粒，一并清除（避免日后无法消除）。
  function checkEliminate() {
    const visited = new Uint8Array(COLS * ROWS);
    let spans = 0;
    const clearSet = new Set();
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const i = idx(r, c);
        if (grid[i] === 0 || visited[i]) continue;
        const color = grid[i];
        const stack = [i]; visited[i] = 1; const comp = [];
        let minC = COLS, maxC = 0;
        while (stack.length) {
          const cur = stack.pop(); comp.push(cur);
          const cr = (cur / COLS) | 0, cc = cur % COLS;
          if (cc < minC) minC = cc; if (cc > maxC) maxC = cc;
          if (cr > 0 && grid[cur - COLS] === color && !visited[cur - COLS]) { visited[cur - COLS] = 1; stack.push(cur - COLS); }
          if (cr < ROWS - 1 && grid[cur + COLS] === color && !visited[cur + COLS]) { visited[cur + COLS] = 1; stack.push(cur + COLS); }
          if (cc > 0 && grid[cur - 1] === color && !visited[cur - 1]) { visited[cur - 1] = 1; stack.push(cur - 1); }
          if (cc < COLS - 1 && grid[cur + 1] === color && !visited[cur + 1]) { visited[cur + 1] = 1; stack.push(cur + 1); }
        }
        // 同色连通块同时触到最左列与最右列 → 横跨左右，消除
        if (minC === 0 && maxC === COLS - 1) { for (const ci of comp) clearSet.add(ci); spans++; }
      }
    }
    if (clearSet.size === 0) return false;

    // mercy：紧邻消除区(距离1)、不同色、且自身小簇(≤MERCY_MAX)的散粒，一并清除
    const mercyChecked = new Uint8Array(COLS * ROWS);
    for (const ci of clearSet) {
      const cr = (ci / COLS) | 0, cc = ci % COLS;
      const neigh = [];
      if (cr > 0) neigh.push(ci - COLS);
      if (cr < ROWS - 1) neigh.push(ci + COLS);
      if (cc > 0) neigh.push(ci - 1);
      if (cc < COLS - 1) neigh.push(ci + 1);
      for (const ni of neigh) {
        if (grid[ni] === 0 || clearSet.has(ni) || mercyChecked[ni]) continue;
        const color = grid[ni];
        const st = [ni]; mercyChecked[ni] = 1; const comp = []; let sz = 0;
        while (st.length) {
          const cur = st.pop(); comp.push(cur); sz++;
          const a = (cur / COLS) | 0, b = cur % COLS;
          const n2 = [];
          if (a > 0) n2.push(cur - COLS);
          if (a < ROWS - 1) n2.push(cur + COLS);
          if (b > 0) n2.push(cur - 1);
          if (b < COLS - 1) n2.push(cur + 1);
          for (const k of n2) { if (!mercyChecked[k] && grid[k] === color) { mercyChecked[k] = 1; st.push(k); } }
        }
        if (sz <= MERCY_MAX) for (const c2 of comp) clearSet.add(c2);
      }
    }

    let cleared = 0;
    for (const ci of clearSet) {
      const v = grid[ci];
      grid[ci] = 0; cleared++; colorCounts[v]++;
      spawnParticles((ci / COLS) | 0, ci % COLS);
    }
    const mult = spans >= 3 ? 3 : (spans >= 2 ? 2 : 1);
    const gained = cleared * 10 * mult;
    score += gained;
    level = Math.floor(score / 1500) + 1;
    shake = 9;
    sndClear();

    if (spans >= 3) floats.push({ t: "AMAZING!", x: VW / 2, y: boardY + boardH / 2, life: 1.1, max: 1.1, size: Math.min(34, VW * 0.09), c: "#FFD93D" });
    else if (spans >= 2) floats.push({ t: "WONDERFUL", x: VW / 2, y: boardY + boardH / 2, life: 1.1, max: 1.1, size: Math.min(30, VW * 0.08), c: "#FFD93D" });
    else floats.push({ t: "+" + gained, x: VW / 2, y: boardY + boardH / 2, life: 0.8, max: 0.8, size: 22, c: "#fff" });

    let guard = 0; while (sandTick() && guard < 300) guard++;
    return true;
  }

  function isToppedOut() {
    for (let c = 0; c < COLS; c++) if (grid[idx(0, c)] !== 0) return true;
    const full = r => { for (let c = 0; c < COLS; c++) if (grid[idx(r, c)] === 0) return false; return true; };
    if (full(1) || full(2)) return true;
    return false;
  }

  // ===================== 落子 =====================
  function placePieceAtTop() {
    const byCol = {};
    for (const p of piece.cells) {
      const c = piece.col0 + p.dc;
      if (c < 0 || c >= COLS) continue;
      (byCol[c] = byCol[c] || []).push(p.dr);
    }
    for (const c in byCol) {
      const cc = +c;
      const drs = byCol[cc].sort((a, b) => a - b);
      for (let k = 0; k < drs.length; k++) {
        const r = drs[k];
        if (r < 0 || r >= ROWS) continue;
        grid[idx(r, cc)] = piece.color;
      }
    }
    sndDrop();
    state = "falling"; ticks = 0; maxTicks = 320;
  }
  function restRow(c) {
    for (let r = ROWS - 1; r >= 0; r--) {
      if (grid[idx(r, c)] === 0 && (r === ROWS - 1 || grid[idx(r + 1, c)] !== 0)) return r;
    }
    return -1;
  }
  function hardDrop() {
    const byCol = {};
    for (const p of piece.cells) {
      const c = piece.col0 + p.dc;
      if (c < 0 || c >= COLS) continue;
      (byCol[c] = byCol[c] || []).push(p.dr);
    }
    for (const c in byCol) {
      const cc = +c; const drs = byCol[cc].sort((a, b) => b - a);
      let rr = restRow(cc);
      if (rr < 0) { gameOver(); return; }
      for (let k = 0; k < drs.length; k++) { if (rr < 0) break; grid[idx(rr, cc)] = piece.color; rr--; }
    }
    sndDrop();
    let g = 0; while (sandTick() && g < 300) g++;
    afterSettle();
  }
  function afterSettle() {
    checkEliminate();
    if (isToppedOut()) { gameOver(); return; }
    spawnPiece();
    state = "aim";
  }
  function gameOver() {
    state = "over";
    if (typeof stopBGM === "function") stopBGM();
    try { localStorage.removeItem("ttl_save"); } catch (e) {} // 死亡后旧存档作废
    if (score > best) { best = score; try { localStorage.setItem("ttl_best", String(best)); } catch (e) {} }
    sndOver();
  }

  // ===================== 输入 =====================
  function toLocal(clientX, clientY) {
    const rect = cv.getBoundingClientRect();
    return { x: (clientX - rect.left) / rect.width * VW, y: (clientY - rect.top) / rect.height * VH };
  }
  function onDown(x, y) {
    ensureAudio();
    if (overlay) { overlayDown(x, y); return; }
    if (state === "cover") { coverDown(x, y); return; }
    if (state === "over") {
      if (inRect(x, y, restartBtn)) { resetGame(); startBGMif(); }
      else if (inRect(x, y, coverBtn2)) { state = "cover"; if (typeof stopBGM === "function") stopBGM(); }
      return;
    }
    // 游戏进行中（aim / falling）
    if (inRect(x, y, menuBtn)) { dragging = false; overlay = "pausemenu"; overlayFrom = "pausemenu"; return; }
    if (state === "aim") {
      if (inRect(x, y, hardBtn)) { hardDrop(); return; }
      dragging = true; updateCol0(x);
    }
  }
  function updateCol0(x) {
    const w = shapeWidth(piece.cells);
    let c = Math.round((x - boardX) / CELL - w / 2);
    c = Math.max(0, Math.min(COLS - w, c));
    piece.col0 = c;
  }
  function onMove(x, y) { if (dragging && state === "aim") updateCol0(x); }
  function onUp() { if (dragging && state === "aim") { dragging = false; placePieceAtTop(); } }

  cv.addEventListener("pointerdown", e => { e.preventDefault(); const p = toLocal(e.clientX, e.clientY); onDown(p.x, p.y); }, { passive: false });
  cv.addEventListener("pointermove", e => { const p = toLocal(e.clientX, e.clientY); onMove(p.x, p.y); }, { passive: false });
  cv.addEventListener("pointerup", e => { e.preventDefault(); onUp(); }, { passive: false });
  cv.addEventListener("pointercancel", e => { onUp(); });

  // ===================== 渲染 =====================
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function hash2(a, b) {
    let h = (a * 374761393 + b * 668265263) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
  }
  // 单个像素细格：fillRect 单色 + 颜色抖动 + 像素描边（边界清晰、密集堆叠）
  function drawPixelCell(x, y, color, gr, gc, size) {
    size = size || CELL;
    const C = COLORS[color];
    const j = (hash2(gr, gc) - 0.5) * 0.14; // ±7% 颜色抖动
    const baseR = parseInt(C.base.slice(1, 3), 16);
    const baseG = parseInt(C.base.slice(3, 5), 16);
    const baseB = parseInt(C.base.slice(5, 7), 16);
    const br = Math.min(255, Math.max(0, (baseR * (1 + j)) | 0));
    const bg = Math.min(255, Math.max(0, (baseG * (1 + j)) | 0));
    const bb = Math.min(255, Math.max(0, (baseB * (1 + j)) | 0));
    ctx.fillStyle = "rgb(" + br + "," + bg + "," + bb + ")";
    ctx.fillRect(x, y, size, size);
    // 像素描边：顶/左高光 + 底/右阴影
    ctx.fillStyle = "rgba(255,255,255,.30)";
    ctx.fillRect(x, y, size, 1);
    ctx.fillRect(x, y, 1, size);
    ctx.fillStyle = "rgba(0,0,0,.24)";
    ctx.fillRect(x, y + size - 1, size, 1);
    ctx.fillRect(x + size - 1, y, 1, size);
  }
  function drawGrain(x, y, color) { drawPixelCell(x, y, color, 0, 0); }

  function drawWoodFrame() {
    // 整屏木框底
    ctx.fillStyle = "#5C3A1E"; ctx.fillRect(0, 0, VW, VH);
    ctx.fillStyle = "rgba(0,0,0,.15)";
    for (let i = 0; i < VW; i += 14) ctx.fillRect(i, 0, 2, VH);
    ctx.fillStyle = "rgba(255,255,255,.05)";
    for (let i = 7; i < VW; i += 14) ctx.fillRect(i, 0, 1, VH);
    // 整屏沙床（铺满可视区，无空白）
    const g = ctx.createLinearGradient(0, 0, 0, VH);
    g.addColorStop(0, "#e8d9b8");
    g.addColorStop(1, "#d4c09a");
    ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
    ctx.fillStyle = "rgba(160,120,70,.06)";
    for (let i = 0; i < VH; i += 8 * CELL) ctx.fillRect(0, i, VW, 1);
    ctx.strokeStyle = "rgba(0,0,0,.5)"; ctx.lineWidth = 2;
    ctx.strokeRect(1, 1, VW - 2, VH - 2);
  }
  function drawGrid() {
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const v = grid[idx(r, c)];
        if (v !== 0) drawPixelCell(boardX + c * CELL, boardY + r * CELL, v, r, c);
      }
    }
  }
  function drawPiece() {
    if (!piece) return;
    const byCol = {};
    for (const p of piece.cells) { const c = piece.col0 + p.dc; (byCol[c] = byCol[c] || []).push(p.dr); }
    ctx.globalAlpha = 0.26;
    for (const c in byCol) {
      const cc = +c; const drs = byCol[cc].sort((a, b) => b - a);
      let rr = restRow(cc);
      for (let k = 0; k < drs.length; k++) { if (rr >= 0) { drawGrain(boardX + cc * CELL, boardY + rr * CELL, piece.color, 0); rr--; } }
    }
    ctx.globalAlpha = 1;
    const trayY = boardY + 4;
    for (const p of piece.cells) drawGrain(boardX + (piece.col0 + p.dc) * CELL, trayY + p.dr * CELL, piece.color, 0);
  }
  function drawHUD() {
    // 进度条（顶部细线）
    const prog = (score % 1500) / 1500;
    ctx.fillStyle = "#2a1a0c"; ctx.fillRect(progBar.x, progBar.y, progBar.w, progBar.h);
    ctx.fillStyle = "#FFD93D"; ctx.fillRect(progBar.x, progBar.y, progBar.w * prog, progBar.h);
    // 标题
    ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
    ctx.fillStyle = "#FFD93D"; ctx.font = "bold 14px Courier New";
    ctx.fillText("推推乐", titlePos.x, titlePos.y);
    // 分数
    ctx.textAlign = "center";
    ctx.fillStyle = "#fff"; ctx.font = "bold " + Math.round(Math.min(22, hudH * 0.55)) + "px Courier New";
    ctx.fillText(String(score), scorePos.x, scorePos.y);
    // 菜单（右上角）
    ctx.fillStyle = "rgba(92,58,30,.85)"; ctx.fillRect(menuBtn.x, menuBtn.y, menuBtn.w, menuBtn.h);
    ctx.strokeStyle = "#caa46a"; ctx.lineWidth = 1; ctx.strokeRect(menuBtn.x + 0.5, menuBtn.y + 0.5, menuBtn.w - 1, menuBtn.h - 1);
    ctx.fillStyle = "#FFD93D"; ctx.font = "bold 12px Courier New"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("菜单", menuBtn.x + menuBtn.w / 2, menuBtn.y + menuBtn.h / 2 + 1);
    ctx.textBaseline = "alphabetic";
    // 颜色累计（悬浮棋盘左下角）
    for (let i = 0; i < 4; i++) {
      const s = countSwatches[i];
      ctx.fillStyle = COLORS[i + 1].base; ctx.fillRect(s.x, s.y, s.w, s.h);
      ctx.strokeStyle = "#2a1a0c"; ctx.lineWidth = 1; ctx.strokeRect(s.x + 0.5, s.y + 0.5, s.w - 1, s.h - 1);
      ctx.fillStyle = "#ffe9a8"; ctx.font = "bold 10px Courier New"; ctx.textAlign = "center";
      ctx.fillText(String(colorCounts[i + 1]), s.x + s.w / 2, s.y + s.h + 11);
    }
    // 硬落（悬浮底部中央）
    ctx.fillStyle = "rgba(92,58,30,.82)"; ctx.fillRect(hardBtn.x, hardBtn.y, hardBtn.w, hardBtn.h);
    ctx.strokeStyle = "#caa46a"; ctx.lineWidth = 1; ctx.strokeRect(hardBtn.x + 0.5, hardBtn.y + 0.5, hardBtn.w - 1, hardBtn.h - 1);
    ctx.fillStyle = "#FFD93D"; ctx.font = "bold " + Math.round(Math.min(15, hardBtn.h * 0.5)) + "px Courier New"; ctx.textAlign = "center";
    ctx.fillText("硬落（瞬间落下）", VW / 2, hardBtn.y + hardBtn.h / 2 + 5);
  }
  // 接下来提示：悬浮在棋盘右上角，显示后续 2 个图形，方便提前规划（放大版，看得清）
  function drawNextHint() {
    const n = Math.min(2, queue.length);
    if (n === 0) return;
    const pw = Math.min(150, VW * 0.52);
    const ph = Math.min(104, VH * 0.26);
    const px = VW - pw - 6, py = 30; // 屏幕右上角（菜单按钮下方）
    ctx.fillStyle = "rgba(20,10,4,.72)";
    roundRect(px, py, pw, ph, 8); ctx.fill();
    ctx.strokeStyle = "rgba(202,164,106,.6)"; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = "#FFD93D"; ctx.font = "bold 14px Courier New"; ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
    ctx.fillText("接下来", px + 8, py + 18);
    const labelH = 24;
    const bw = (pw - 16) / n, bh = ph - labelH - 6;
    for (let k = 0; k < n; k++) {
      const pc = queue[k]; if (!pc) continue;
      const bx = px + 8 + k * bw, by = py + labelH;
      ctx.fillStyle = "#2a1808"; ctx.fillRect(bx, by, bw - 4, bh);
      ctx.strokeStyle = "rgba(202,164,106,.35)"; ctx.lineWidth = 1; ctx.strokeRect(bx + 0.5, by + 0.5, bw - 5, bh - 1);
      let maxr = 0, maxc = 0; for (const p of pc.cells) { maxr = Math.max(maxr, p.dr); maxc = Math.max(maxc, p.dc); }
      const w = maxc + 1, h = maxr + 1;
      const cs = Math.max(2, Math.floor(Math.min((bw - 12) / w, (bh - 12) / h)));
      const ox = bx + (bw - 4 - w * cs) / 2, oy = by + (bh - h * cs) / 2;
      for (const p of pc.cells) drawPixelCell(ox + p.dc * cs, oy + p.dr * cs, pc.color, p.dr, p.dc, cs);
    }
  }
  function drawParticles(dt) {
    for (const p of particles) {
      if (!p.a) continue;
      p.life -= dt; if (p.life <= 0) { p.a = false; continue; }
      p.vy += 320 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.fillStyle = p.c; ctx.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s);
    }
    ctx.globalAlpha = 1;
  }
  function drawFloats(dt) {
    for (let i = floats.length - 1; i >= 0; i--) {
      const f = floats[i]; f.life -= dt; f.y -= 18 * dt;
      if (f.life <= 0) { floats.splice(i, 1); continue; }
      const a = Math.min(1, f.life / f.max * 1.6);
      ctx.globalAlpha = a; ctx.textAlign = "center";
      ctx.font = "bold " + f.size + "px Courier New";
      ctx.lineWidth = 4; ctx.strokeStyle = "#a82b2b"; ctx.strokeText(f.t, f.x, f.y);
      ctx.fillStyle = f.c; ctx.fillText(f.t, f.x, f.y);
    }
    ctx.globalAlpha = 1;
  }
  function drawCover() {
    drawDim(0.78);
    ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
    ctx.fillStyle = "#FFD93D"; ctx.font = "bold 46px Courier New"; ctx.fillText("推 推 乐", VW / 2, VH * 0.16);
    ctx.fillStyle = "#fff"; ctx.font = "bold 18px Courier New"; ctx.fillText("一玩就停不下来的像素沙盒", VW / 2, VH * 0.16 + 30);
    for (const b of coverButtons()) drawButton(b);
    ctx.fillStyle = "#bbb"; ctx.font = "13px Courier New";
    ctx.fillText("最佳 " + best, VW / 2, VH * 0.92);
    ctx.fillStyle = "#e8c98a"; ctx.font = "12px Courier New";
    ctx.fillText("拖动方块 · 同色连成桥 · 哗啦消除", VW / 2, VH * 0.92 + 20);
  }
  function drawPauseMenu() {
    drawDim(0.6);
    drawPanel("暂停");
    for (const b of pauseButtons()) drawButton(b);
  }
  function drawSettings() {
    drawDim(0.6);
    drawPanel("设置");
    ctx.fillStyle = "#e8c98a"; ctx.font = "12px Courier New"; ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
    ctx.fillText("背景音乐开关与音量", VW / 2, VH / 2 - 92);
    for (const b of settingsButtons()) drawButton(b);
  }
  function drawHelp() {
    drawDim(0.6);
    drawPanel("玩法说明");
    const lines = [
      "欢迎来到「推推乐」沙盒小世界！",
      "",
      "四种颜色的方块从上方落下，拖动它",
      "左右移动，松手就「哗啦」摊成一堆沙。",
      "",
      "✦ 魔法规则：同一种颜色的沙，只要",
      "从左墙一路连到右墙（斜着绕也行），",
      "整片就被一键消除，哗——全清！",
      "",
      "✦ 右上角能偷看「接下来」两个形状，",
      "点「硬落」可瞬间砸下；卡住了点右上",
      "角「菜单」随时存档、回封面。",
      "",
      "✦ 别让沙堆戳到天花板！连得越顺，",
      "分数越炸裂～去刷新你的最佳纪录吧！",
    ];
    ctx.fillStyle = "#f3e6c8"; ctx.font = "13px Courier New"; ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
    const ly = VH / 2 - 150;
    for (let i = 0; i < lines.length; i++) ctx.fillText(lines[i], VW / 2, ly + i * 20);
    for (const b of helpButtons()) drawButton(b);
  }
  function drawToast() {
    if (toastT <= 0) return;
    const a = Math.min(1, toastT / 1.6);
    ctx.globalAlpha = a;
    const tw = Math.min(220, VW - 40), tx = (VW - tw) / 2, ty = VH - 92;
    ctx.fillStyle = "rgba(20,10,4,.92)"; roundRect(tx, ty, tw, 34, 8); ctx.fill();
    ctx.strokeStyle = "#caa46a"; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = "#FFD93D"; ctx.font = "bold 15px Courier New"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(toastMsg, VW / 2, ty + 17);
    ctx.globalAlpha = 1; ctx.textBaseline = "alphabetic";
  }
  function drawOver() {
    drawDim(0.85);
    ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
    ctx.fillStyle = "#E94B4B"; ctx.font = "bold 38px Courier New"; ctx.fillText("游戏结束", VW / 2, VH * 0.28);
    ctx.fillStyle = "#fff"; ctx.font = "bold 30px Courier New"; ctx.fillText("得分 " + score, VW / 2, VH * 0.28 + 64);
    ctx.fillStyle = "#FFD93D"; ctx.font = "15px Courier New"; ctx.fillText("最佳 " + best, VW / 2, VH * 0.28 + 98);
    ctx.fillStyle = "#e8c98a"; ctx.font = "14px Courier New";
    ctx.fillText("沙堆戳到天花板啦～再战一局？", VW / 2, VH * 0.28 + 140);
    ctx.fillStyle = "#5C3A1E"; ctx.fillRect(restartBtn.x, restartBtn.y, restartBtn.w, restartBtn.h);
    ctx.strokeStyle = "#FFD93D"; ctx.lineWidth = 2; ctx.strokeRect(restartBtn.x, restartBtn.y, restartBtn.w, restartBtn.h);
    ctx.fillStyle = "#FFD93D"; ctx.font = "bold 20px Courier New"; ctx.textBaseline = "middle";
    ctx.fillText("再来一局", VW / 2, restartBtn.y + restartBtn.h / 2);
    ctx.fillStyle = "rgba(92,58,30,.9)"; ctx.fillRect(coverBtn2.x, coverBtn2.y, coverBtn2.w, coverBtn2.h);
    ctx.strokeStyle = "#caa46a"; ctx.lineWidth = 1; ctx.strokeRect(coverBtn2.x + 0.5, coverBtn2.y + 0.5, coverBtn2.w - 1, coverBtn2.h - 1);
    ctx.fillStyle = "#FFD93D"; ctx.font = "bold 16px Courier New";
    ctx.fillText("回到封面", VW / 2, coverBtn2.y + coverBtn2.h / 2);
    ctx.textBaseline = "alphabetic";
  }

  // ===================== 主循环 =====================
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;

    if (state === "falling" && !overlay) {
      let moved = false;
      for (let n = 0; n < 3; n++) { if (sandTick()) { moved = true; } else break; ticks++; }
      if (!moved || ticks >= maxTicks) afterSettle();
    }

    if (shake > 0) shake = Math.max(0, shake - dt * 30);

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, VW, VH);
    if (shake > 0) {
      const dx = (Math.random() * 2 - 1) * shake, dy = (Math.random() * 2 - 1) * shake;
      ctx.setTransform(DPR, 0, 0, DPR, dx * DPR, dy * DPR);
    }
    drawWoodFrame();
    drawGrid();
    drawNextHint();
    if (state === "aim") drawPiece();
    drawParticles(dt);
    drawFloats(dt);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (state === "aim" || state === "falling") drawHUD();

    if (state === "cover") drawCover();
    else if (state === "over") drawOver();
    if (overlay === "pausemenu") drawPauseMenu();
    else if (overlay === "settings") drawSettings();
    else if (overlay === "help") drawHelp();
    if (toastT > 0) { toastT -= dt; drawToast(); }

    requestAnimationFrame(frame);
  }

  layout();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
