<h2 id="sec-2">《落秋》</h2>
<p class="poem">我想落下一片秋叶</p>
<p class="poem">从我与地坛落入你的眉间</p>
<p class="poem">笔下沙沙作响的秋叶余温</p>
<p class="poem">是诉不尽的思念看不清的离别</p>
<p class="poem">是写不完的诗篇落不下的秋叶</p>
<p class="poem">纸上承不了的泪花翻涌</p>
<p class="poem">凉风吹散苍茫茫烟波</p>
<p class="poem">热情过后一地戚戚哀伤</p>
<p class="poem">等待着皑皑白雪</p>
<p class="poem">尽收苍凉</p>
<p class="poem">这片落叶飘零半生</p>
<p class="poem">最后在一个阳光明媚的下午</p>
<p class="poem">悠闲的迎接死亡</p>
<p class="poem">带上微风，沾染泥土</p>
<p class="poem">拥抱自由</p>
<p class="psrc">（来自小米笔记）</p>
