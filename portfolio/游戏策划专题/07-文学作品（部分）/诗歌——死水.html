<h2>《死水》</h2>
<p class="poem">我想化作一潭死水</p>
<p class="poem">明晃晃地照应着绿叶</p>
<p class="poem">山鸡纵翅飞跃我的臂膀</p>
<p class="poem">我只得一把搂住山川河流</p>
<p class="poem">默默潜入混浊的水面</p>
<p class="poem">我是一摊死水</p>
<p class="poem">死气沉沉没有明日的光晕</p>
<p class="poem">昨日的清澈早已默默无言</p>
<p class="poem">清风再次拂过倒影中的山岗</p>
<p class="poem">定睛望去那繁星匆忙</p>
<p class="poem">天地悠悠尽显苍苍</p>
<p class="poem">波澜水面尽是仓惶</p>
<p class="poem">我的生命没有奔放</p>
<p class="poem">只剩沉默中的最后肮脏</p>
<p class="psrc">（来自小米笔记）</p>
